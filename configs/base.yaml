seed: 42
device: cpu

model:
  name: gm_hrm
  hidden_dim: 32
  input_dim: 32
  output_dim: 10

memory:
  enabled: false
  slots: 4
  slot_dim: 32
  reset_each_forward: true

halting:
  enabled: true
  max_segments: 2
  ponder_cost: 0.0
  threshold: 1.0

implicit_grad:
  k_steps: 1

training:
  batch_size: 2
  lr: 1.0e-3
  epochs: 1
  weight_decay: 0.0
  grad_clip_norm: 1.0

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

data:
  name: sudoku
  num_workers: 4
  pin_memory: true

  arc:
    max_grid_size: 30
    augment_retries_factor: 5
    num_aug: 1000

  maze:
    charset: "# SGo"
    num_transforms: 8
    aug: false

  sudoku:
    grid_size: 9
    block_size: 3
    num_aug: 0
    min_difficulty: null
